# Create a separate Docker service. Do not change the runtime of the existing Python service.
# Reuse its PostgreSQL URL and device key via private env vars; never create a second database.
services:
  - type: web
    name: AutoSort-IoT-Java
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: COOKIE_SECURE
        value: 'true'
      - key: DEVICE_API_KEY
        sync: false
      - key: MIGRATE_DATABASE
        value: 'true'
