spring.application.name=autosort-backend
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]
server.port=${PORT:8000}
server.address=0.0.0.0
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=12
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-file-size=1000000B
spring.servlet.multipart.max-request-size=1100000B
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
