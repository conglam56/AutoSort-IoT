name: autosort
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: autosort
      POSTGRES_USER: autosort
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosort -d autosort"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
