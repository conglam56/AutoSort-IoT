name: Backend and bridge
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: autosort
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: autosort
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U autosort"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud-ai/requirements-dev.txt
      - run: pip install -r cloud-ai/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Firmware state machine
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/firmware_controller_test.cpp -o "$RUNNER_TEMP/controller-test"
          "$RUNNER_TEMP/controller-test"
      - run: mvn -B -f backend/pom.xml verify
        env:
          AUTOSORT_TEST_DATABASE_URL: postgresql://autosort:integration-test-only@127.0.0.1:5432/autosort
          AUTOSORT_TEST_PYTHON: python
      - run: docker build -t autosort-backend:test .
      - run: python tests/integration_spring_bridge.py
        env:
          AUTOSORT_TEST_DATABASE_URL: postgresql://autosort:integration-test-only@127.0.0.1:5432/autosort
      - run: python tests/integration_spring_bridge.py --task detect
        env:
          AUTOSORT_TEST_DATABASE_URL: postgresql://autosort:integration-test-only@127.0.0.1:5432/autosort
      - run: python tests/integration_spring_bridge.py --task detect --web-control
        env:
          AUTOSORT_TEST_DATABASE_URL: postgresql://autosort:integration-test-only@127.0.0.1:5432/autosort
      - run: python tests/integration_spring_bridge.py --task detect --web-control --video-camera
        env:
          AUTOSORT_TEST_DATABASE_URL: postgresql://autosort:integration-test-only@127.0.0.1:5432/autosort
